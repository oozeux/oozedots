# Auto-generado por Matugen — Plantilla para Yazi

[manager]
cwd = { fg = "#ffb4ac" }

# Selección y elementos sobrevolados
hovered         = { fg = "#ffdad6", bg = "#93000e" }
preview_hovered = { bg = "#2b1c1a" }

# Búsqueda / Find
find_keyword  = { fg = "#ffdcc2", bg = "#693c10", bold = true }
find_position = { fg = "#fbb983", bg = "reset", bold = true }

# Marcadores de archivos
marker_copied   = { fg = "#f5b9a1", bg = "#663c2a" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#ffb4ac", bg = "#93000e" }
marker_selected = { fg = "#fbb983", bg = "#693c10" }

# Pestañas
tab_active   = { fg = "#ffdad6", bg = "#93000e", bold = true }
tab_inactive = { fg = "#dbc0bd", bg = "#2b1c1a" }

# Bordes (Corregido)
border_symbol = "│"
border_style  = { fg = "#554240" }

[mode]
normal_main = { fg = "#1e100e", bg = "#ffb4ac", bold = true }
normal_alt  = { fg = "#ffb4ac", bg = "#2b1c1a" }

select_main = { fg = "#1e100e", bg = "#f5b9a1", bold = true }
select_alt  = { fg = "#f5b9a1", bg = "#2b1c1a" }

unset_main  = { fg = "#1e100e", bg = "#ffb4ab", bold = true }
unset_alt   = { fg = "#ffb4ab", bg = "#2b1c1a" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#2b1c1a", bg = "#2b1c1a" }

# Barra de progreso
progress_label  = { fg = "#f9dcd9", bold = true }
progress_normal = { fg = "#ffb4ac", bg = "#180b09" }
progress_error  = { fg = "#ffb4ab", bg = "#180b09" }

# Permisos
perm_sep  = { fg = "#554240" }
perm_type = { fg = "#ffb4ac" }
perm_read = { fg = "#f5b9a1" }
perm_write= { fg = "#ffb4ab" }
perm_exec = { fg = "#fbb983" }

[select]
border   = { fg = "#ffb4ac" }
active   = { fg = "#ffdad6", bg = "#93000e" }
inactive = { fg = "#f9dcd9" }

[input]
border   = { fg = "#ffb4ac" }
title    = { fg = "#ffb4ac" }
value    = { fg = "#f9dcd9" }
selected = { bg = "#93000e" }

[completion]
border   = { fg = "#ffb4ac" }
active   = { fg = "#ffdad6", bg = "#93000e" }
inactive = { fg = "#f9dcd9" }

[tasks]
border  = { fg = "#ffb4ac" }
title   = { fg = "#ffb4ac" }
hover   = { fg = "#ffdad6", bg = "#93000e" }

[which]
mask            = { bg = "#180b09" }
cand            = { fg = "#ffb4ac" }
rest            = { fg = "#dbc0bd" }
desc            = { fg = "#f5b9a1" }
separator       = "  "
separator_style = { fg = "#554240" }

[help]
on      = { fg = "#ffb4ac" }
exec    = { fg = "#f5b9a1" }
desc    = { fg = "#f9dcd9" }
hover   = { fg = "#ffdad6", bg = "#93000e" }
footer  = { fg = "#dbc0bd", bg = "#2b1c1a" }

[filetype]
rules = [
	{ url = "*/", fg = "#ffb4ac", bold = true },
	{ mime = "image/*", fg = "#fbb983" },
	{ mime = "video/*", fg = "#f5b9a1" },
	{ mime = "audio/*", fg = "#f5b9a1" },
	{ mime = "application/x-tar", fg = "#ffb4ab" },
	{ mime = "application/x-bzip*", fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/zip", fg = "#ffb4ab" },
	{ mime = "application/x-rar", fg = "#ffb4ab" },
	{ url = "*", is = "exec", fg = "#f5b9a1" },
	{ url = "*", is = "link", fg = "#fbb983" },
	{ url = "*", is = "orphan", fg = "#ffb4ab" },
	{ mime = "*", fg = "#f9dcd9" }
]