# ~/.config/matugen/templates/starship.toml
# Starship + Matugen

format = """
[](fg:#ffb4ac)\
$username\
[](bg:#f5b9a1 fg:#ffb4ac)\
$hostname\
[](bg:#fbb983 fg:#f5b9a1)\
$directory\
[](fg:#fbb983)\
$git_branch\
$git_status\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true


# ─────────────────────────────────────────────
# Usuario
# ─────────────────────────────────────────────

[username]
show_always = true

style_user = "bg:#ffb4ac fg:#690007 bold"
style_root = "bg:#ffb4ab fg:#690005 bold"

format = "[✦ $user]($style)"


# ─────────────────────────────────────────────
# Hostname
# ─────────────────────────────────────────────

[hostname]
ssh_only = false

style = "bg:#f5b9a1 fg:#4b2716 bold"

format = "[@$hostname]($style)"


# ─────────────────────────────────────────────
# Directorio
# ─────────────────────────────────────────────

[directory]
style = "bg:#fbb983 fg:#4d2700 bold"

format = "[ ◈ $path ]($style)"

truncation_length = 3
truncation_symbol = "…/"


[directory.substitutions]
"Documents" = "▣"
"Downloads" = "⇩"
"Music" = "♫"
"Pictures" = "▧"
"Videos" = "▶"
"Projects" = "⌘"


# ─────────────────────────────────────────────
# Git branch
# ─────────────────────────────────────────────

[git_branch]
symbol = "⎇ "

style = "bg:#93000e fg:#ffdad6 bold"

format = "[](fg:#93000e)[ $symbol$branch ]($style)[](fg:#93000e)"


# ─────────────────────────────────────────────
# Git status
# ─────────────────────────────────────────────

[git_status]
style = "bold #ffb4ac"

format = "[( $all_status$ahead_behind)]($style)"

conflicted = "✖ "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕${ahead_count}↓${behind_count} "
untracked = "… "
modified = "● "
staged = "✓ "
renamed = "» "
deleted = "− "


# ─────────────────────────────────────────────
# Duración del comando
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 2_000

style = "bold #fbb983"

format = " ⏱ [$duration]($style)"
disabled = false


# ─────────────────────────────────────────────
# Hora
# ─────────────────────────────────────────────

[time]
disabled = false

style = "bold #ffb4ac"

format = " ⯈ [$time]($style)"

time_format = "%I:%M %p"


# ─────────────────────────────────────────────
# Prompt
# ─────────────────────────────────────────────

[character]
success_symbol = "[╭─ ⮞](bold #ffb4ac) "
error_symbol = "[╭─ ⮞](bold #ffb4ab) "
